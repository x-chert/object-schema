name: Auto Release
on:
  push:
    tags:
      - "v*.*.*"
permissions:
  contents: write
  pull-requests: read
  repository-projects: read
jobs:
  generate-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Generate App Token
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}
          persist-credentials: true
      - name: Build Custom Changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          configuration: ".github/changelog-config.json"
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
      - name: Prepend CHANGELOG.md
        run: |
          echo "${{ steps.build_changelog.outputs.changelog }}" > new_part.tmp
          awk '/[^[:space:]]/ {last=NR} {lines[NR]=$0} END {for (i=1; i<=last; i++) if (i in lines) print lines[i]}' new_part.tmp > new_part_clean.tmp
          touch CHANGELOG.md
          awk '/[^[:space:]]/ {p=1} p' CHANGELOG.md > old_part_clean.tmp
          if [ -s old_part_clean.tmp ]; then
            cat new_part_clean.tmp > CHANGELOG.md
            echo -e "\n" >> CHANGELOG.md
            cat old_part_clean.tmp >> CHANGELOG.md
          else
            cat new_part_clean.tmp > CHANGELOG.md
          fi
          rm -f *.tmp
      - name: Commit, Move Tag and Push
        env:
          TAG_NAME: ${{ github.ref_name }}
          TARGET_BRANCH: ${{ github.event.base_ref }}
        run: |
          git config user.email "${{ steps.generate_token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git config user.name "${{ steps.generate_token.outputs.app-slug }}[bot]"
          git add CHANGELOG.md
          git commit -m "Update CHANGELOG.md [skip ci]"
          git tag -d "$TAG_NAME"
          git tag "$TAG_NAME"
          git push origin :refs/tags/$TAG_NAME
          CLEAN_BRANCH=$(echo "$TARGET_BRANCH" | sed 's|refs/heads/||')
          git push origin HEAD:"$CLEAN_BRANCH"
          git push origin "$TAG_NAME"
  create-release:
    runs-on: ubuntu-latest
    needs: generate-changelog
    steps:
      - name: Generate App Token
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}
          persist-credentials: true
      - name: Build release notes
        id: build_release_notes
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          configuration: ".github/release-note-config.json"
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.build_release_notes.outputs.changelog }}
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
  publish-on-packagist:
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - name: Trigger Packagist Update
        run: |
          curl -XPOST -H "Content-Type: application/json" \
          "https://packagist.org/api/update-package?username=${{ vars.PACKAGIST_USERNAME }}&apiToken=${{ secrets.PACKAGIST_TOKEN }}" \
          -d '{"repository":{"url":"https://github.com/${{ github.repository }}"}}'